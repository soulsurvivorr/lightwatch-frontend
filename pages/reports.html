<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1C1F26">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/dev-logo.png?v=20260707">
  <link rel="apple-touch-icon" sizes="192x192" href="/images/dev-logo.png?v=20260707">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LightWatch">
  <title>Reports — LightWatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/home.css" />
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="app-loading">

  <div class="lw-boot-loader" id="lwBootLoader" aria-hidden="true">
    <div class="lw-loader-orbit">
      <div class="lw-loader-rings"></div>
      <div class="lw-loader-core">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M4 6.5H10.5L12 4L13.5 6.5H20" stroke="#06241f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 12H20" stroke="#06241f" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M4 17.5H10L12 20L14 17.5H20" stroke="#06241f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
  </div>

  <header class="topbar">
    <div class="topbar__inner">

      <!--<div class="brand">
        <span class="brand__mark">LW</span>
        <span>LightWatch</span>
      </div>-->

      <div class="topbar__brand">
        <img src="../images/dev-logo.png" alt="LightWatch Logo" width="32" height="32">
        <p>LightWatch GH</p>
      </div>

      <input type="checkbox" id="nav-toggle" class="nav-toggle" />
      <label for="nav-toggle" class="nav-toggle-label" aria-label="Toggle navigation">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </label>

      <nav class="nav" id="primaryNav">
        <a href="./home.html" class="nav__link" data-nav="home">Home</a>
        <a href="./reports.html" class="nav__link" data-nav="reports">Reports</a>
        <a href="./account.html" class="nav__link" data-nav="account">Account</a>
      </nav>

      <button type="button" id="profileMenuButton" class="topbar__user" aria-expanded="false" aria-controls="userSidebarPanel">
        <span class="avatar-name" id="topbarUserName">Guest</span>
        <span class="avatar" id="topbarAvatar">?</span>
      </button>

    </div>
  </header>

  <main class="page">

    <div class="page__header">
      <div>
        <div class="page__eyebrow">Reports</div>
        <h1 class="page__title">All reports</h1>
        <p class="page__subtitle">Every status report submitted across LightWatch locations in Kumasi.</p>
      </div>
    </div>

    <div class="card report-card">
      <div class="card__head">
        <span class="card__title">Recent activity</span>
        <span class="card__meta">Sorted by newest first</span>
      </div>
      <div class="report-list"></div>
    </div>
  </main>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="user-sidebar-panel" id="userSidebarPanel" aria-hidden="true">
    <button type="button" class="user-sidebar__close" id="userSidebarClose" aria-label="Close profile panel">×</button>
    <div class="card profile-card profile-card--sidebar">
      <div class="card__head">
        <span class="card__title">Logged in as</span>
        <span class="card__meta">User profile</span>
      </div>
      <div class="profile-card__avatar">
        <span class="avatar avatar--large" id="sidebarAvatar">?</span>
      </div>
      <div class="profile-card__info">
        <div class="profile-card__name" id="sidebarName">Not signed in</div>
      </div>
      <div class="profile-card__details">
        <div><span>Contact</span><strong id="sidebarContact">—</strong></div>
        <div><span>Region</span><strong id="sidebarRegion">—</strong></div>
        <div><span>Last login</span><strong id="sidebarLastLogin">—</strong></div>
      </div>
      <button type="button" class="btn btn--primary btn--block" onclick="window.location.href='account.html'">Manage account</button>
      <button type="button" class="btn btn--ghost btn--block" id="sidebarSignOutBtn">Log out</button>
    </div>
  </aside>

  <div id="bottom_nav_wrapper">
    <div class="bottom-icons-container">
      <a href="./home.html" class="bottom-nav-link" data-nav="home" aria-label="Home">
        <span class="bottom-nav-icon bottom-nav-icon--user"><img src="../icons/home.png" alt="Home"></span>
        <span class="bottom-nav-label">Home</span>
      </a>
      <a href="./reports.html" class="bottom-nav-link" data-nav="reports" aria-label="Reports">
        <span class="bottom-nav-icon bottom-nav-icon--user"><img src="../icons/report_2.png" alt="reports"></span>
        <span class="bottom-nav-label">Reports</span>
      </a>
      <button type="button" class="bottom-nav-link bottom-nav-link--button" id="bottomNavUserBtn" data-nav="account" aria-label="User profile">
        <span class="bottom-nav-icon bottom-nav-icon--user"><img src="../icons/user.png" alt="You"></span>
        <span class="bottom-nav-label">You</span>
      </button>
    </div>
  </div>


  <script src="../Js/config.js"></script>
  <script src="../Js/auth.js"></script>
  <script src="../Js/profile.js"></script>
  <script src="../Js/reports.js"></script>
  <script src="../Js/nav.js"></script>
</body>
</html>
