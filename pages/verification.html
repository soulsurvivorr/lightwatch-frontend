<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1C1F26">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/dev-logo.png?v=20260707">
    <link rel="apple-touch-icon" sizes="192x192" href="/images/dev-logo.png?v=20260707">
    <link rel="preload" as="image" href="/images/dev-logo.png?v=20260707">
    <link rel="preload" as="image" href="/images/fb_prompt_code_img.png">
    <title>LightWatch GH</title> 
    <link rel="icon" href="../images/dev-logo.png" type="image/x-icon">
    <link rel="stylesheet" href="../css/verification.css">
</head> 
<body> 
    <header> 
        <img src="/images/dev-logo.png?v=20260707" alt="LightWatch Logo" width="40" height="40" loading="eager" fetchpriority="high" decoding="async">
        <h3>LightWatch GH</h3> 
    </header> 
 
    <main> 
        <div class="verify-card"> 
            <h2>Check your phone</h2> 
            <p id="code-text"></p>
            <img src="/images/fb_prompt_code_img.png" alt="Verification code prompt" loading="eager" fetchpriority="high" decoding="async" width="320" height="240">
            <div class="otp-boxes" id="otpBoxes">
                <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-box" aria-label="Digit 1">
                <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-box" aria-label="Digit 2">
                <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-box" aria-label="Digit 3">
                <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-box" aria-label="Digit 4">
            </div>
            <p id="error-msg" style="color: red; font-size: .8rem;"></p>
            <div class="resend-row"> 
                <img src="../icons/refresh.png" alt="refresh for new code" width="16" height="16">
                <p>It may take a few minutes for you to get this code. <span id="resendCodeLink">Get a new code</span></p> 
            </div> 
            <button id="continueBtn" disabled>Continue</button> 
        </div> 
    </main> 

    <script src="../Js/config.js"></script>
    <script src="../Js/auth.js"></script>
    <script src="../Js/verification.js"></script>
</body> 
</html>
