<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>LightWatch GHq</title> 
    <link rel="icon" href="../images/dev-logo.png" type="image/x-icon">
    <link rel="stylesheet" href="../css/verification.css">
</head> 
<body> 
    <header> 
        <img src="../images/dev-logo.png" alt=""> 
        <h3>LightWatch GH</h3> 
    </header> 
 
    <main> 
        <div class="verify-card"> 
            <h2>Check your phone</h2> 
            <p id="code-text"></p>
            <img src="../images/fb_prompt_code_img.png" alt=""> 
            <input type="text" name="" id="otp-input" placeholder="Code"> 
            <p id="error-msg" style="color: red; font-size: .8rem;"></p>
            <div class="resend-row"> 
                <img src="../icons/refresh.png" alt="refresh for new code"> 
                <p>It may take a few minutes for you to get this code. <span>Get a new code</span></p> 
            </div> 
            <button id="continueBtn">Continue</button> 
        </div> 
    </main> 

    <script src="../js/config.js"></script>
    <script src="../js/verification.js">
    </script>
</body> 
</html>
